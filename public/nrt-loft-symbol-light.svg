<svg width="48" height="56" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Roof gable -->
  <polyline points="4,28 24,6 44,28" stroke="#92400e" stroke-width="1.8" fill="none" stroke-linejoin="miter" />
  <!-- Building body -->
  <rect x="4" y="28" width="40" height="24" stroke="#92400e" stroke-width="1.4" fill="none" opacity="0.85" />
  <!-- Window grid -->
  <line x1="24" y1="28" x2="24" y2="52" stroke="#92400e" stroke-width="0.7" opacity="0.5" />
  <line x1="4"  y1="38" x2="44" y2="38" stroke="#92400e" stroke-width="0.7" opacity="0.5" />
  <line x1="4"  y1="46" x2="44" y2="46" stroke="#92400e" stroke-width="0.7" opacity="0.5" />
  <!-- Chimney -->
  <rect x="34" y="14" width="5" height="9" stroke="#92400e" stroke-width="1" fill="none" opacity="0.6" />
  <!-- Ground line -->
  <line x1="0" y1="52" x2="48" y2="52" stroke="#92400e" stroke-width="1.4" opacity="0.4" />
</svg>
