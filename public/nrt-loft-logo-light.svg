<svg width="230" height="72" viewBox="0 0 230 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Roof gable -->
  <polyline points="4,28 18,10 32,28" stroke="#92400e" stroke-width="1.8" fill="none" stroke-linejoin="miter" />
  <!-- Building body -->
  <rect x="4" y="28" width="28" height="30" stroke="#92400e" stroke-width="1.4" fill="none" opacity="0.85" />
  <!-- Window grid -->
  <line x1="18" y1="28" x2="18" y2="58" stroke="#92400e" stroke-width="0.7" opacity="0.5" />
  <line x1="4"  y1="40" x2="32" y2="40" stroke="#92400e" stroke-width="0.7" opacity="0.5" />
  <line x1="4"  y1="49" x2="32" y2="49" stroke="#92400e" stroke-width="0.7" opacity="0.5" />
  <!-- Chimney -->
  <rect x="24" y="14" width="4" height="8" stroke="#92400e" stroke-width="1" fill="none" opacity="0.6" />
  <!-- Ground line -->
  <line x1="0" y1="58" x2="36" y2="58" stroke="#92400e" stroke-width="1.4" opacity="0.4" />

  <!-- Logotype -->
  <text x="48" y="35" font-family="'Bebas Neue', Impact, sans-serif" font-size="28" font-weight="400" fill="#1a1208" letter-spacing="5">NRT-LOFT</text>
  <line x1="48" y1="42" x2="218" y2="42" stroke="rgba(180,90,0,0.4)" stroke-width="0.8" />
  <text x="48" y="54" font-family="'Share Tech Mono', monospace" font-size="8" fill="#92400e" letter-spacing="3" opacity="0.8">OPEN FLOOR, OPEN MIND</text>
</svg>
